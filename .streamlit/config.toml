# 深色主題 — st.dataframe / st.data_editor 表格(canvas 網格,CSS 蓋不到)
# 仿 futu-dashboard,顏色對齊 lib/style.py 檔頭色票常數。
[theme]
base = "dark"
backgroundColor = "#14171F"          # 頁面底色 BG
